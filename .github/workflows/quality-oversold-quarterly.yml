name: Quality oversold quarterly watchlist

on:
  schedule:
    # The 15th of the second month after each filing quarter closes.
    - cron: "30 22 15 2,5,8,11 *"
  workflow_dispatch:
    inputs:
      as_of:
        description: Optional YYYY-MM-DD refresh date
        required: false
        type: string
      persist_changes:
        description: Commit refreshed files to main
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: quality-oversold-automation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: >-
            analysis/quality-oversold-sec-feasibility/requirements-forward.txt

      - name: Install dependencies
        working-directory: analysis/quality-oversold-sec-feasibility
        run: pip install -r requirements-forward.txt

      - name: Resolve refresh date
        id: refresh-date
        shell: bash
        run: |
          value="${{ inputs.as_of }}"
          if [[ -z "$value" ]]; then
            value="$(date -u +%F)"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Refresh quality watchlist
        working-directory: analysis/quality-oversold-sec-feasibility
        run: >-
          python watchlist_automation.py
          --as-of "${{ steps.refresh-date.outputs.value }}"

      - name: Commit quarterly source and watchlist files
        if: >-
          github.event_name == 'schedule' ||
          inputs.persist_changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            analysis/quality-oversold-sec-feasibility/data/sp500_constituents.json \
            analysis/quality-oversold-sec-feasibility/data/companyfacts_manifest.json \
            analysis/quality-oversold-sec-feasibility/data/dividend_payment_status.json \
            analysis/quality-oversold-sec-feasibility/data/watchlist.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh quality watchlist ${{ steps.refresh-date.outputs.value }}"
          git pull --rebase origin main
          git push origin HEAD:main

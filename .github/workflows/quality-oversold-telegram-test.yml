name: Quality oversold Telegram test

on:
  workflow_dispatch:
    inputs:
      message_case:
        description: Message shape to send
        required: true
        default: current_signals
        type: choice
        options:
          - current_signals
          - zero_signals

permissions:
  contents: read

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4

      - name: Send committed daily result
        if: inputs.message_case == 'current_signals'
        working-directory: analysis/quality-oversold-sec-feasibility
        run: >-
          python telegram_notify.py
          --daily-result results/daily/2026-07-29.json

      - name: Send zero-signal test
        if: inputs.message_case == 'zero_signals'
        working-directory: analysis/quality-oversold-sec-feasibility
        run: >-
          python telegram_notify.py
          --daily-result results/daily/2026-07-29.json
          --test-zero-signals
